<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axonix ULTRA X</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
--bg:#050510;
--panel:rgba(0,0,0,0.6);
--glass:rgba(255,255,255,0.08);
--border:rgba(255,255,255,0.08);
--text:#ffffff;
--accent1:#00f2ff;
--accent2:#ff00ff;
--radius:18px;
--transition:0.3s ease;
}

body.light{
--bg:#f4f6fb;
--panel:rgba(255,255,255,0.8);
--glass:rgba(0,0,0,0.05);
--border:rgba(0,0,0,0.08);
--text:#111;
--accent1:#0066ff;
--accent2:#00c3ff;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Poppins',sans-serif;
background:var(--bg);
color:var(--text);
height:100vh;
overflow:hidden;
transition:var(--transition);
}

.container{display:flex;height:100vh;}

.sidebar{
width:280px;
background:var(--panel);
backdrop-filter:blur(30px);
border-right:1px solid var(--border);
display:flex;
flex-direction:column;
padding:20px;
}

.logo{
font-family:'Orbitron',sans-serif;
font-size:26px;
font-weight:900;
text-align:center;
margin-bottom:30px;
background:linear-gradient(90deg,var(--accent1),var(--accent2));
-webkit-background-clip:text;
color:transparent;
}

.menu button{
width:100%;
padding:12px;
margin-bottom:10px;
border:none;
border-radius:var(--radius);
background:var(--glass);
color:var(--text);
cursor:pointer;
}

.menu button:hover{
background:linear-gradient(90deg,var(--accent1),var(--accent2));
color:black;
}

.history{
flex:1;
overflow-y:auto;
margin-top:10px;
font-size:13px;
}

.history div{
padding:8px;
margin-bottom:6px;
border-radius:12px;
background:var(--glass);
cursor:pointer;
}

.chat-area{
flex:1;
display:flex;
flex-direction:column;
}

.chat-header{
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid var(--border);
background:var(--panel);
}

.header-buttons button{
margin-left:10px;
padding:6px 12px;
border:none;
border-radius:10px;
cursor:pointer;
background:var(--glass);
color:var(--text);
}

.messages{
flex:1;
overflow-y:auto;
padding:30px;
display:flex;
flex-direction:column;
gap:15px;
}

.message{
max-width:75%;
padding:12px 16px;
border-radius:var(--radius);
word-wrap:break-word;
}

.user{
align-self:flex-end;
background:linear-gradient(90deg,var(--accent1),var(--accent2));
color:black;
}

.bot{
align-self:flex-start;
background:var(--glass);
border:1px solid var(--border);
}

.input-area{
padding:15px 30px;
display:flex;
gap:10px;
border-top:1px solid var(--border);
background:var(--panel);
}

textarea{
flex:1;
padding:12px;
border-radius:25px;
border:none;
resize:none;
background:var(--glass);
color:var(--text);
height:45px;
}

.input-area button{
padding:10px 20px;
border:none;
border-radius:25px;
background:linear-gradient(90deg,var(--accent1),var(--accent2));
color:black;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="sidebar" id="sidebar">
<div class="logo">AXONIX</div>

<div class="menu">
<button onclick="newSession()">New Chat</button>
<button onclick="toggleTheme()">Toggle Theme</button>
<button onclick="clearAll()">Clear All</button>
<button onclick="downloadChat()">Download</button>
</div>

<div class="history" id="history"></div>
</div>

<div class="chat-area">

<div class="chat-header">
<span>Axonix ULTRA X</span>
<div class="header-buttons">
<button onclick="toggleSidebar()"></button>
</div>
</div>

<div class="messages" id="messages"></div>

<div class="input-area">
<textarea id="userInput" placeholder="Ask anything..."></textarea>
<button onclick="sendMessage()">Send</button>
</div>

</div>
</div>

<!--  script.js -->
<script src="script.js"></script>

<script>

let messagesBox=document.getElementById("messages");
let input=document.getElementById("userInput");
let historyBox=document.getElementById("history");

let sessions=JSON.parse(localStorage.getItem("axonix_sessions"))||{};
let currentSession="default";

function saveSessions(){
localStorage.setItem("axonix_sessions",JSON.stringify(sessions));
}

function loadSession(name){
messagesBox.innerHTML="";
currentSession=name;
if(!sessions[name]) sessions[name]=[];
sessions[name].forEach(m=>addMessage(m.text,m.type,false));
}

function newSession(){
let name="Session "+(Object.keys(sessions).length+1);
sessions[name]=[];
saveSessions();
renderHistory();
loadSession(name);
}

function renderHistory(){
historyBox.innerHTML="";
Object.keys(sessions).forEach(name=>{
let div=document.createElement("div");
div.innerText=name;
div.onclick=()=>loadSession(name);
historyBox.appendChild(div);
});
}

function addMessage(text,type,save=true){
let msg=document.createElement("div");
msg.classList.add("message",type);
msg.innerText=text;
messagesBox.appendChild(msg);
messagesBox.scrollTop=messagesBox.scrollHeight;

if(save){
sessions[currentSession].push({text,type});
saveSessions();
}
}

async function sendMessage(){
let text=input.value.trim();
if(!text) return;

addMessage(text,"user");
input.value="";

let thinking=document.createElement("div");
thinking.classList.add("message","bot");
thinking.innerText="Thinking...";
messagesBox.appendChild(thinking);
messagesBox.scrollTop=messagesBox.scrollHeight;

let reply=await getAIResponse(text);

messagesBox.removeChild(thinking);
addMessage(reply,"bot");
}

function toggleSidebar(){
document.getElementById("sidebar").classList.toggle("active");
}

function toggleTheme(){
document.body.classList.toggle("light");
}

function clearAll(){
sessions={};
saveSessions();
renderHistory();
messagesBox.innerHTML="";
}

function downloadChat(){
let content="";
sessions[currentSession].forEach(m=>{
content+=m.type.toUpperCase()+": "+m.text+"\n\n";
});
let blob=new Blob([content],{type:"text/plain"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="axonix_chat.txt";
a.click();
}

input.addEventListener("keydown",function(e){
if(e.key==="Enter" && !e.shiftKey){
e.preventDefault();
sendMessage();
}
});

window.onload=function(){
if(!sessions["default"]) sessions["default"]=[];
renderHistory();
loadSession("default");
addMessage("Axonix ULTRA X initialized.","bot");
};

</script>

</body>
</html>
